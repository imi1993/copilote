<!doctype html><html><head><meta charset="utf-8"><title>Moteur de transcription</title></head><body>
<script type="module">
// Moteur de transcription (Whisper dans le navigateur). Reçoit des morceaux audio de l'extension, renvoie du texte.
const P=window.parent;const say=(o)=>P.postMessage(o,'*');
let asr=null;const pg=p=>{if(p.status==='progress'&&p.total)say({type:'status',text:'Téléchargement du modèle : '+Math.round(p.loaded/p.total*100)+' %'})};
try{
  say({type:'status',text:'Chargement du modèle (la première fois, environ 1 minute)'});
  const {pipeline}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
  asr=await pipeline('automatic-speech-recognition','onnx-community/whisper-base.en',{device:'webgpu',progress_callback:pg}).catch(()=>{say({type:'status',text:'Mode normal (plus lent)'});return pipeline('automatic-speech-recognition','onnx-community/whisper-base.en',{progress_callback:pg})});
  say({type:'ready'});
}catch(e){say({type:'error',text:'Modèle non chargé : '+(e&&e.message||e)})}
let busy=false;
addEventListener('message',async(e)=>{
  if(!e.origin.startsWith('chrome-extension://'))return; // seulement l'extension
  const d=e.data||{};
  if(d.type==='audio'&&asr&&!busy){busy=true;say({type:'busy',on:true});
    try{let r;try{r=await asr(d.samples,{no_repeat_ngram_size:4,repetition_penalty:1.15})}catch(_){r=await asr(d.samples)}const t=(r.text||'').replace(/\[[^\]]*\]|\([^)]*\)/g,'').trim();if(t.length>3)say({type:'text',text:t})}
    catch(err){say({type:'error',text:String(err&&err.message||err)})}
    busy=false;say({type:'busy',on:false})}
});
</script></body></html>
